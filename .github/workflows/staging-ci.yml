name: Staging CI

on:
  push:
    branches:
      - staging
      - agent/architecture-simplification-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/agent/architecture-simplification-20261114'
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Check out staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci --no-audit --no-fund

      - name: Inventory package consumers and state helpers
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: |
          echo '=== Bare @perigram imports ==='
          git grep -nE "from ['\"]@perigram/|import\\(['\"]@perigram/" -- '*.js' '*.mjs' '*.ts' '*.vue' | grep -v '/vendor/' || true
          echo '=== Package entrypoint references ==='
          git grep -nE 'packages/(core|cts|processes|workflows)/src/index|#packages/(core|cts|processes|workflows)|@perigram/(core|cts|processes|workflows)' -- '*.js' '*.mjs' '*.ts' '*.vue' | grep -v '/vendor/' || true
          echo '=== State helper references ==='
          git grep -nE '\\b(getPrimaryState|getRegionState|normalizeStatusLifecycle|normalizeLifecycle|getPrimaryStatus)\\b' -- '*.js' '*.mjs' '*.ts' '*.vue' | grep -v '/vendor/' || true
          echo '=== Workspace package manifests ==='
          for file in packages/*/package.json; do node -e "const p=require('./$file'); console.log(JSON.stringify({name:p.name,version:p.version,private:p.private,exports:p.exports,dependencies:p.dependencies||{} }))"; done

      - name: Run complete Vitest suite
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx vitest run

      - name: Run SSR smoke tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx vitest run --config vitest.ssr.config.js

      - name: Check architecture
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: node scripts/check-arch.js

      - name: Validate framework declarations
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run framework:validate

      - name: Validate documentation
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run docs:validate

      - name: Check plugin executor dependencies
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run plugin-deps:check
