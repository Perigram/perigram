name: Staging CI

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate operational scripts
        run: |
          bash -n scripts/dev.sh scripts/deploy.sh
          ./scripts/dev.sh --help
          if env -i PATH="$PATH" ./scripts/deploy.sh >/tmp/deploy-check.log 2>&1; then
            echo "deploy.sh unexpectedly accepted an empty environment" >&2
            exit 1
          else
            status=$?
            [ "$status" -eq 2 ] || { cat /tmp/deploy-check.log; exit "$status"; }
            grep -q "Missing deployment configuration" /tmp/deploy-check.log
          fi

      - name: Inventory application package consumers
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: node scripts/report-package-consumers.js

      - name: Reject retired workflow package references
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: |
          if git grep -nE 'packages/(workflows|devtools|mcp)/src|@perigram/(workflows|devtools|mcp)' -- '*.js' '*.mjs' '*.ts' '*.vue' '*.md' '*.json' ':!**/TODO.md' ':!**/TODO.md_archive'; then
            echo "Retired workflow package references remain."
            exit 1
          fi

      - name: Run complete Vitest suite
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx vitest run

      - name: Run SSR smoke tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx vitest run --config vitest.ssr.config.js

      - name: Validate graph and HAG Playwright spec discovery
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx playwright test --list e2e/documents-fill-dialog.spec.js e2e/graph-documents-preview.spec.js

      - name: Check architecture
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: node scripts/check-arch.js

      - name: Validate framework declarations
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run framework:validate

      - name: Validate documentation
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run docs:validate

      - name: Check plugin executor dependencies
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run plugin-deps:check
