name: Staging CI

on:
  push:
    branches:
      - staging
      - agent/architecture-simplification-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/agent/architecture-simplification-20261114'
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject retired workflow package references
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: |
          if git grep -nE 'packages/workflows|workflows/src/index.js|@perigram/workflows' -- '*.js' '*.mjs' '*.ts' '*.vue' '*.md' '*.json' ':!TODO.md' ':!TODO.md_archive'; then
            echo "Retired workflow package references remain."
            exit 1
          fi

      - name: Run complete Vitest suite
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx vitest run

      - name: Run SSR smoke tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx vitest run --config vitest.ssr.config.js

      - name: Check architecture
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: node scripts/check-arch.js

      - name: Validate framework declarations
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run framework:validate

      - name: Validate documentation
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run docs:validate

      - name: Check plugin executor dependencies
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run plugin-deps:check
