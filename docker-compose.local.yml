# docker-compose.local.yml

services:
  mongo:
    image: mongo:4.4
    container_name: perigram_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - perigram-network
    restart: always

  user-file-processing-worker:
    image: ghcr.io/1suo/file-processing-worker:latest
    build:
      context: .
      dockerfile: workers/fileprocessing/Dockerfile
    container_name: user-file-processing-worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/perigram_dev
      - PERIGRAM_API_URL=${PERIGRAM_API_URL:-http://host.docker.internal:3000}
      - WORKER_TOKEN=${WORKER_TOKEN:-perigram-dev-worker}
      - WORKER_ID=file-processing-normal
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    depends_on:
      - mongo
    networks:
      - perigram-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cassette-processing-worker:
    build:
      context: .
      dockerfile: workers/cassette-processing/Dockerfile
    container_name: cassette-processing-worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/perigram_dev
      - PERIGRAM_API_URL=${PERIGRAM_API_URL:-http://host.docker.internal:3000}
      - WORKER_TOKEN=${WORKER_TOKEN:-perigram-dev-worker}
      - WORKER_ID=cassette-processing
    depends_on:
      - mongo
    networks:
      - perigram-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:latest
    build:
      context: .
      dockerfile: workers/nesting/Dockerfile
    container_name: nesting-worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/perigram_dev
    depends_on:
      - mongo
    networks:
      - perigram-network
    restart: unless-stopped

networks:
  perigram-network:
    external: true

volumes:
  mongo-data:
