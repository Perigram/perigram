# docker-compose.local.yml

services:
  mongo:
    image: mongo:4.4
    container_name: perigram_mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - perigram-network
    restart: always

  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:latest
    build:
      context: .
      dockerfile: workers/nesting/Dockerfile
    container_name: nesting-worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/perigram_dev
    depends_on:
      - mongo
    networks:
      - perigram-network
    restart: unless-stopped

networks:
  perigram-network:
    external: true

volumes:
  mongo-data:
