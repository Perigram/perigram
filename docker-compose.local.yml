# docker-compose.local.yml
version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: nest2d_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  user-file-processing-worker:
    image: ghcr.io/vovastelmashchuk/user-file-processing-worker:latest
    environment:
      - MONGO_URI=mongodb://mongo:27017/nest2d
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    depends_on:
      - mongo
    restart: unless-stopped

  nesting-worker:
    image: ghcr.io/vovastelmashchuk/nesting-worker:latest
    environment:
      - MONGO_URI=mongodb://mongo:27017/nest2d
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:

