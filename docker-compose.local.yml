# docker-compose.local.yml
version: "3.8"

services:
  mongo:
    image: mongo:4.4
    container_name: cutkit_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cutkit-network
    restart: always

  user-file-processing-worker:
    image: ghcr.io/1suo/file-processing-worker:latest
    container_name: user-file-processing-worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    depends_on:
      - mongo
    networks:
      - cutkit-network
    restart: unless-stopped

  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:latest
    container_name: nesting-worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit
    depends_on:
      - mongo
    networks:
      - cutkit-network
    restart: unless-stopped

networks:
  cutkit-network:
    driver: bridge

volumes:
  mongo-data:

