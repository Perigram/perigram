version: "3.8"
services:
  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGO_URI
    deploy:
      replicas: ${WORKERS_REPLICAS:-1}
      update_config:
        order: start-first
    networks:
      - cutkit-network

networks:
  cutkit-network:
    external: true
