# Dev egress: renders room composites to the shared /recordings volume.
# The LiveKit server must point at the same redis (livekit.dev.yaml) —
# egress dispatch rides it. Prod deployments copy this shape with real keys
# and TLS.
api_key: devkey
api_secret: devsecret
ws_url: ws://livekit:7880
insecure: true
redis:
  address: redis:6379
storage:
  local:
    path: /recordings
