version: "3.8"
services:
  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:latest
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/perigram_dev
    deploy:
      replicas: 1
      update_config:
        order: start-first

  mongo:
    image: mongo:4.4
    container_name: perigram_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
