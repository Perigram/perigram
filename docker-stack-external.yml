version: "3.8"
services:
  user-file-processing-worker-normal:
    image: ghcr.io/1suo/file-processing-worker:latest
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit_dev
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    deploy:
      replicas: 1
      update_config:
        order: start-first

  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:latest
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit_dev
    deploy:
      replicas: 1
      update_config:
        order: start-first

  mongo:
    image: mongo:4.4
    container_name: cutkit_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
