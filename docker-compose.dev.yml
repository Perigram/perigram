# docker-compose.dev.yml
# For local development with hot reload

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cutkit_app_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/src
      - /src/node_modules
    environment:
      - MONGODB_URI=mongodb://mongo:27017/cutkit_dev
      - NODE_ENV=development
      - WORKER_TOKEN=${WORKER_TOKEN:-cutkit-dev-worker}
      - NESTING_WORKER_URL=http://nesting-worker:8000/nest
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - CONFIG_BOT_CHAT_MODEL=${CONFIG_BOT_CHAT_MODEL:-qwen3:4b}
      - CONFIG_BOT_EMBED_MODEL=${CONFIG_BOT_EMBED_MODEL:-bge-m3}
      - CONFIG_BOT_CORTEX_PATH=${CONFIG_BOT_CORTEX_PATH:-/home/isuo/Documents/cutkit-cortex}
    depends_on:
      - mongo
    networks:
      - cutkit-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: cutkit_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cutkit-network
    restart: always

  user-file-processing-worker:
    image: ghcr.io/1suo/file-processing-worker:latest
    build:
      context: .
      dockerfile: workers/fileprocessing/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit_dev
      - CUTKIT_API_URL=http://app:3000
      - WORKER_TOKEN=${WORKER_TOKEN:-cutkit-dev-worker}
      - WORKER_ID=file-processing-normal
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    depends_on:
      - app
      - mongo
    networks:
      - cutkit-network
    restart: unless-stopped

  nesting-worker:
    build:
      context: .
      dockerfile: workers/nesting/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit_dev
    depends_on:
      - mongo
    networks:
      - cutkit-network
    restart: unless-stopped

  cassette-processing-worker:
    build:
      context: .
      dockerfile: workers/cassette-processing/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit_dev
      - CUTKIT_API_URL=http://app:3000
      - WORKER_TOKEN=${WORKER_TOKEN:-cutkit-dev-worker}
      - WORKER_ID=cassette-processing
    depends_on:
      - app
      - mongo
    networks:
      - cutkit-network
    restart: unless-stopped

networks:
  cutkit-network:
    external: true

volumes:
  mongo-data:
