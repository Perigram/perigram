# docker-compose.dev.yml
# For local development with hot reload
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cutkit_app_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/src
      - /src/node_modules
    environment:
      - MONGODB_URI=mongodb://mongo:27017/cutkit_dev
      - NODE_ENV=development
    depends_on:
      - mongo
    networks:
      - cutkit-network
    command: npm run dev
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: cutkit_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cutkit-network
    restart: always

  user-file-processing-worker:
    image: ghcr.io/1suo/file-processing-worker:latest
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit_dev
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    depends_on:
      - mongo
    networks:
      - cutkit-network
    restart: unless-stopped

  nesting-worker:
    build:
      context: ./workers/nesting
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/cutkit_dev
    depends_on:
      - mongo
    networks:
      - cutkit-network
    restart: unless-stopped

networks:
  cutkit-network:
    driver: bridge

volumes:
  mongo-data:
