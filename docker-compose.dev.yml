# docker-compose.dev.yml
# For local development with hot reload

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: perigram_app_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/src
      - /src/node_modules
      - ${CONFIG_BOT_CORTEX_HOST_PATH:-/home/isuo/Documents/perigram-cortex}:/opt/perigram-cortex:ro
    environment:
      - MONGODB_URI=mongodb://mongo:27017/perigram_dev
      - NODE_ENV=development
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=4096}
      - WORKER_TOKEN=${WORKER_TOKEN:-perigram-dev-worker}
      - NESTING_WORKER_URL=http://nesting-worker:8000/nest
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      - LIVEKIT_INTERNAL_URL=${LIVEKIT_INTERNAL_URL:-ws://livekit:7880}
      - NUXT_DEV_HTTPS=${NUXT_DEV_HTTPS:-false}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - NUXT_DEV_HMR_HOST=${NUXT_DEV_HMR_HOST:-}
      - NUXT_DEV_HMR_PROTOCOL=${NUXT_DEV_HMR_PROTOCOL:-ws}
      - NUXT_DEV_HMR_CLIENT_PORT=${NUXT_DEV_HMR_CLIENT_PORT:-3000}
      - CONFIG_BOT_CHAT_MODEL=${CONFIG_BOT_CHAT_MODEL:-qwen3:4b}
      - CONFIG_BOT_EMBED_MODEL=${CONFIG_BOT_EMBED_MODEL:-bge-m3}
      - CONFIG_BOT_CORTEX_PATH=${CONFIG_BOT_CORTEX_PATH:-/opt/perigram-cortex}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-none}
      - TRANSCRIPTION_LOCAL_BASE_URL=${TRANSCRIPTION_LOCAL_BASE_URL:-}
      - TRANSCRIPTION_LOCAL_API_KEY=${TRANSCRIPTION_LOCAL_API_KEY:-}
      - TRANSCRIPTION_LANGUAGE=${TRANSCRIPTION_LANGUAGE:-}
      - TRANSCRIPTION_CLOUD_BASE_URL=${TRANSCRIPTION_CLOUD_BASE_URL:-}
      - TRANSCRIPTION_CLOUD_API_KEY=${TRANSCRIPTION_CLOUD_API_KEY:-}
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-}
    depends_on:
      - mongo
      - livekit
    networks:
      - perigram-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c 'npm run dev -- --host 0.0.0.0 $( [ "$NUXT_DEV_HTTPS" = "true" ] && echo --https )'
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: perigram_livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - perigram-network
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: perigram_mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - perigram-network
    restart: always
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "try { db.adminCommand('ismaster').ok } catch (e) { 0 }"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nesting-worker:
    build:
      context: .
      dockerfile: workers/nesting/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/perigram_dev
    depends_on:
      - mongo
    networks:
      - perigram-network
    restart: unless-stopped

networks:
  perigram-network:
    external: true

volumes:
  mongo-data:
