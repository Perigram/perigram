# TODO: Replace the image names with your own Docker images
version: "3.8"
services:
  app:
    image: ghcr.io/1suo/cutkit-app:${GIT_COMMIT_HASH:-latest}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - 7100:3000
    volumes:
      - ${CONFIG_BOT_CORTEX_HOST_PATH:-/home/cutkit/Documents/cutkit-cortex}:/opt/cutkit-cortex:ro
    environment:
      - BASE_URL=${BASE_URL:-http://192.168.0.67:7100}
      - NUXT_PUBLIC_BASE_URL=${NUXT_PUBLIC_BASE_URL:-http://192.168.0.67:7100}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=${NUXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NUXT_PUBLIC_GITHUB_CLIENT_ID=${NUXT_PUBLIC_GITHUB_CLIENT_ID}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - NUXT_RESEND_TOKEN=${RESEND_TOKEN}
      - WORKER_TOKEN=${WORKER_TOKEN}
      - NESTING_WORKER_URL=http://nesting-worker:8000/nest
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.0.67:11434}
      - CONFIG_BOT_CHAT_MODEL=${CONFIG_BOT_CHAT_MODEL:-qwen3:4b}
      - CONFIG_BOT_EMBED_MODEL=${CONFIG_BOT_EMBED_MODEL:-bge-m3}
      - CONFIG_BOT_CORTEX_PATH=${CONFIG_BOT_CORTEX_PATH:-/opt/cutkit-cortex}
    secrets:
      - source: cutkit_stripe_secret_key
        target: stripe_secret_key
      - source: cutkit_github_client_secret
        target: github_client_secret
    deploy:
      update_config:
        order: start-first
    networks:
      - infra_reverse-proxy
      - cutkit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/service/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongo:
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db
    networks:
      - cutkit-network
    deploy:
      placement:
        constraints:
          - node.role == manager
  
  user-file-processing-worker-normal:
    image: ghcr.io/1suo/file-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - MONGO_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - CUTKIT_API_URL=http://app:3000
      - WORKER_TOKEN=${WORKER_TOKEN}
      - WORKER_ID=file-processing-normal
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

  user-file-processing-worker-1k-entity-count:
    image: ghcr.io/1suo/file-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - MONGO_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - CUTKIT_API_URL=http://app:3000
      - WORKER_TOKEN=${WORKER_TOKEN}
      - WORKER_ID=file-processing-1k-entity-count
      - WORKER_TAG=1k_entity_count
      - MAX_ENTITY_LIMIT=999999
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

  cassette-processing-worker:
    image: ghcr.io/1suo/cassette-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - MONGO_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - CUTKIT_API_URL=http://app:3000
      - WORKER_TOKEN=${WORKER_TOKEN}
      - WORKER_ID=cassette-processing
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

  geometry-capture-worker:
    image: ghcr.io/1suo/geometry-capture-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - CUTKIT_API_URL=http://app:3000
      - WORKER_TOKEN=${WORKER_TOKEN}
      - GEOMETRY_CAPTURE_WORKER_ID=geometry-capture
      - GEOMETRY_CAPTURE_ML=${GEOMETRY_CAPTURE_ML:-1}
      - GEOMETRY_CAPTURE_MODEL_FIRST=${GEOMETRY_CAPTURE_MODEL_FIRST:-1}
      - GEOMETRY_CAPTURE_PRELOAD_MODELS=${GEOMETRY_CAPTURE_PRELOAD_MODELS:-}
      - HF_HOME=/models/huggingface
      - SAM2_MODEL_ID=${SAM2_MODEL_ID:-facebook/sam2-hiera-tiny}
      - SAM2_CHECKPOINT=${SAM2_CHECKPOINT:-}
      - SAM2_MODEL_CFG=${SAM2_MODEL_CFG:-}
      - SAM2_DEVICE=${SAM2_DEVICE:-cpu}
      - GROUNDING_DINO_MODEL=${GROUNDING_DINO_MODEL:-IDEA-Research/grounding-dino-tiny}
      - GROUNDING_DINO_DEVICE=${GROUNDING_DINO_DEVICE:-cpu}
      - GROUNDING_DINO_BOX_THRESHOLD=${GROUNDING_DINO_BOX_THRESHOLD:-0.25}
      - GROUNDING_DINO_TEXT_THRESHOLD=${GROUNDING_DINO_TEXT_THRESHOLD:-0.25}
    volumes:
      - geometry-model-cache:/models
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

secrets:
  cutkit_stripe_secret_key:
    external: true
  cutkit_github_client_secret:
    external: true

networks:
  infra_reverse-proxy:
    external: true
  cutkit-network:
    external: true

volumes:
  mongo-data:
  geometry-model-cache:
