# TODO: Replace the image names with your own Docker images
version: "3.8"
services:
  app:
    image: ghcr.io/1suo/cutkit-app:${GIT_COMMIT_HASH:-latest}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - 7100:3000
    environment:
      - NUXT_PUBLIC_BASE_URL=https://cutkit-demo-production.up.railway.app/
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=${NUXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NUXT_PUBLIC_GITHUB_CLIENT_ID=${NUXT_PUBLIC_GITHUB_CLIENT_ID}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - NUXT_RESEND_TOKEN=${RESEND_TOKEN}
    secrets:
      - source: cutkit_stripe_secret_key
        target: stripe_secret_key
      - source: cutkit_github_client_secret
        target: github_client_secret
    deploy:
      update_config:
        order: start-first
    networks:
      - infra_reverse-proxy
      - cutkit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/service/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongo:
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db
    networks:
      - cutkit-network
    deploy:
      placement:
        constraints:
          - node.role == manager
  
  user-file-processing-worker-normal:
    image: ghcr.io/1suo/file-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

  user-file-processing-worker-1k-entity-count:
    image: ghcr.io/1suo/file-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
      - WORKER_TAG=1k_entity_count
      - MAX_ENTITY_LIMIT=999999
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

  nesting-worker:
    image: ghcr.io/1suo/nesting-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cutkit_dev}
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first
    networks:
      - cutkit-network

secrets:
  cutkit_stripe_secret_key:
    external: true
  cutkit_github_client_secret:
    external: true

networks:
  infra_reverse-proxy:
    external: true
  cutkit-network:
    external: true

volumes:
  mongo-data:
