name: deploy-staging
on:
  push:
    branches: [ staging ]
jobs:
  deploy:
    runs-on: deploy
    container:
      image: docker:cli
      options: --add-host forgejo.sodalab.pro:192.168.0.15
    steps:
      - name: tools
        run: apk add --no-cache git
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${TOKEN}@forgejo.sodalab.pro/perigram/perigram.git" .
          # The nesting solver is a pinned submodule (jagua-rs) — the
          # shallow clone skips it, and github is provider-blocked on the
          # runner, so the fetch rides the LAN relay.
          git -c http.proxy=http://192.168.0.100:12334 \
              -c https.proxy=http://192.168.0.100:12334 \
              submodule update --init --depth 1 workers/nesting/jagua-rs
      - name: pull base images
        # Registry egress from the runner is DPI-flaky (the same class the
        # npm layer's LAN relay covers): warm the daemon's store with
        # retries so base-image resolution survives a blocked window.
        run: |
          retry() { i=0; while [ $i -lt 5 ]; do "$@" && return 0; i=$((i+1)); echo "attempt $i failed" >&2; sleep $((i*10)); done; "$@"; }
          for image in node:24.15.0-slim rust:1.83 python:3.11-slim node:24-alpine; do
            retry docker pull "$image" || echo "WARN: pull $image kept failing; the build retry may still resolve it"
          done
      - name: build image
        run: |
          retry() { i=0; while [ $i -lt 5 ]; do "$@" && return 0; i=$((i+1)); echo "attempt $i failed" >&2; sleep $((i*10)); done; "$@"; }
          retry docker build --network=host --build-arg PORT=3001 --build-arg GIT_COMMIT_SHA="$GITHUB_SHA" -t perigram:staging .
      - name: build nesting worker image
        run: |
          retry() { i=0; while [ $i -lt 5 ]; do "$@" && return 0; i=$((i+1)); echo "attempt $i failed" >&2; sleep $((i*10)); done; "$@"; }
          retry docker build --network=host -t perigram-nesting:staging -f workers/nesting/Dockerfile .
      - name: build plugin executor images
        # Each plugin executor as its own image (its dependency install
        # beside the zero-dep SDK — the extracted hosting form).
        run: |
          retry() { i=0; while [ $i -lt 5 ]; do "$@" && return 0; i=$((i+1)); echo "attempt $i failed" >&2; sleep $((i*10)); done; "$@"; }
          retry docker build --network=host -t perigram-executor-facade:staging --build-arg PLUGIN=facade -f workers/plugin-executor.Dockerfile .
          retry docker build --network=host -t perigram-executor-documents:staging --build-arg PLUGIN=documents -f workers/plugin-executor.Dockerfile .
          retry docker build --network=host -t perigram-executor-tech-drawing:staging --build-arg PLUGIN=tech-drawing -f workers/plugin-executor.Dockerfile .
      - name: plugin executor stack
        # The plugins host beside the app: the nesting solver (the facade
        # executor's HTTP dependency) and the three plugin executors,
        # re-created per deploy. The app (host-networked) reaches them on
        # 127.0.0.1:879x.
        run: |
          docker rm -f perigram-nesting perigram-facade-executor perigram-documents-executor perigram-tech-drawing-executor || true
          docker run -d --name perigram-nesting --restart unless-stopped \
            --network host \
            perigram-nesting:staging
          docker run -d --name perigram-facade-executor --restart unless-stopped \
            --network host \
            -e FACADE_EXECUTOR_PORT=8790 \
            -e NESTING_WORKER_URL=http://127.0.0.1:8000/nest \
            perigram-executor-facade:staging
          docker run -d --name perigram-documents-executor --restart unless-stopped \
            --network host \
            -e DOCUMENTS_EXECUTOR_PORT=8791 \
            perigram-executor-documents:staging
          docker run -d --name perigram-tech-drawing-executor --restart unless-stopped \
            --network host \
            -e TECH_DRAWING_EXECUTOR_PORT=8792 \
            perigram-executor-tech-drawing:staging
      - name: probe the executor plane
        # The job container sits on the runner bridge; the executors sit on
        # the host network. Probe through the host daemon with the image
        # this pipeline just built.
        run: |
          docker run --rm --network host perigram:staging sh -c '
            for port in 8000 8790 8791 8792; do
              n=0
              until curl -s -o /dev/null "http://127.0.0.1:$port/"; do
                n=$((n+1))
                if [ $n -ge 15 ]; then echo ":$port never answered" >&2; exit 1; fi
                sleep 2
              done
              echo ":$port answered"
            done'
      - name: seed catalog and ensure builtin installs
        # The built-in listings publish and every organization gets the
        # three plugins installed (idempotent — existing installs skip;
        # legacy service nodes rewrite where they persist). Installs write
        # directly: plain node, no Nuxt aliases.
        # The seed/migrate scripts import the mongodb driver, the app
        # image is a slim runtime, and the runner's workspace cannot be
        # bind-mounted into sibling containers — the seed ships as its
        # own image (deploy/seed.Dockerfile).
        run: |
          docker build --network=host -t perigram-seed:staging -f deploy/seed.Dockerfile .
          docker run --rm --network host \
            -e NUXT_MONGODB_URI="mongodb://192.168.0.248:27017/cutkit?directConnection=true" \
            -e FACADE_EXECUTOR_URL=http://127.0.0.1:8790 \
            -e DOCUMENTS_EXECUTOR_URL=http://127.0.0.1:8791 \
            -e TECH_DRAWING_EXECUTOR_URL=http://127.0.0.1:8792 \
            perigram-seed:staging sh -c "node server/scripts/seed-plugin-catalog.js \
              && node server/scripts/migrate-facade-pack-to-plugin.js \
              && node server/scripts/migrate-tech-drawing-pack-to-plugin.js \
              && node server/scripts/migrate-documents-pack-to-plugin.js"
      - name: redeploy container
        env:
          NUXT_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          NUXT_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
        run: |
          docker rm -f perigram-staging || true
          docker run -d --name perigram-staging --restart unless-stopped \
            --network=host \
            -e NUXT_MONGODB_URI=mongodb://192.168.0.248:27017/cutkit?directConnection=true \
            -e BASE_URL=https://perigram.sodalab.pro \
            -e NUXT_PUBLIC_BASE_URL=https://perigram.sodalab.pro \
            -e FACADE_EXECUTOR_URL=http://127.0.0.1:8790 \
            -e DOCUMENTS_EXECUTOR_URL=http://127.0.0.1:8791 \
            -e TECH_DRAWING_EXECUTOR_URL=http://127.0.0.1:8792 \
            -e LIVEKIT_PUBLIC_URL=wss://perigram.sodalab.pro/livekit \
            -e LIVEKIT_INTERNAL_URL=ws://192.168.0.15:7880 \
            -e LIVEKIT_API_KEY \
            -e LIVEKIT_API_SECRET \
            -e TRANSCRIPTION_PROVIDER=local \
            -e TRANSCRIPTION_LOCAL_BASE_URL=http://192.168.0.15:31135/v1 \
            -e MEETINGS_LLM_BASE_URL=http://192.168.0.15:31136/v1 \
            -e MEETINGS_LLM_MODEL=qwen3:4b \
            -e LIVEKIT_RECORDINGS_S3_ENDPOINT=https://perigram.sodalab.pro/recordings \
            -e LIVEKIT_RECORDINGS_S3_BUCKET=livekit-egress \
            -e LIVEKIT_RECORDINGS_S3_ACCESS_KEY="$GARAGE_ACCESS_KEY" \
            -e LIVEKIT_RECORDINGS_S3_SECRET_KEY="$GARAGE_SECRET_KEY" \
            -e LIVEKIT_RECORDINGS_S3_UPLOAD_ENDPOINT=http://127.0.0.1:8333 \
            -e NUXT_VAPID_PUBLIC_KEY \
            -e NUXT_VAPID_PRIVATE_KEY \
            perigram:staging
      - name: verify the served app is this build
        # A squatted :3001 or a crash-looped container serves an earlier
        # build while every other check stays green: the served document
        # must reference the entry chunk of the image this pipeline built.
        run: |
          [ -n "$(docker ps --filter name=perigram-staging --filter status=running -q)" ] \
            || { echo "perigram-staging is not running" >&2; exit 1; }
          ENTRY=$(docker run --rm --entrypoint sh perigram:staging \
            -c "ls /src/.output/public/_nuxt/ | grep -m1 '^entry.*\.js\$'")
          echo "image entry chunk: $ENTRY"
          n=0
          until curl -s http://127.0.0.1:3001/ | grep -q "$ENTRY"; do
            n=$((n+1))
            if [ $n -ge 15 ]; then
              echo "served HTML never referenced $ENTRY — :3001 serves a different build; an orphan process may hold the port" >&2
              exit 1
            fi
            sleep 2
          done
          echo "served app matches the built image"
