name: deploy-staging
on:
  push:
    branches: [ staging ]
jobs:
  deploy:
    runs-on: deploy
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: npm ci --no-audit --no-fund
      - name: build
        run: npm run build
      - name: stage
        run: |
          rsync -a --delete .output/ /srv/perigram/
      - name: restart
        run: systemctl restart perigram-serve
