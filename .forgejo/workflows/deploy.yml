name: deploy-staging
on:
  push:
    branches: [ staging ]
jobs:
  deploy:
    runs-on: deploy
    container:
      image: docker:cli
      options: --add-host forgejo.sodalab.pro:192.168.0.15
      volumes:
        - /run/docker.sock:/var/run/docker.sock
    steps:
      - name: git for checkout
        run: apk add --no-cache git
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t perigram:staging --build-arg PORT=3001 .
      - name: redeploy container
        run: |
          docker rm -f perigram-staging || true
          docker run -d --name perigram-staging --restart unless-stopped -p 3001:3001 perigram:staging
