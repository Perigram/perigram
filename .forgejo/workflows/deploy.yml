name: deploy-staging
on:
  push:
    branches: [ staging ]
jobs:
  deploy:
    runs-on: deploy
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: export PATH=/run/current-system/sw/bin:$PATH && npm ci --no-audit --no-fund
      - name: build
        run: export PATH=/run/current-system/sw/bin:$PATH && npm run build
      - name: stage
        run: /run/current-system/sw/bin/rsync -a --delete .output/ /srv/perigram/
      - name: restart
        run: sudo /run/current-system/sw/bin/systemctl restart perigram-serve
