name: deploy-staging
on:
  push:
    branches: [ staging ]
jobs:
  deploy:
    runs-on: deploy
    container:
      image: docker:cli
      options: --add-host forgejo.sodalab.pro:192.168.0.15
    steps:
      - name: tools
        run: apk add --no-cache git
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${TOKEN}@forgejo.sodalab.pro/sodalab/perigram.git" .
      - name: build image
        run: docker build --network=host -t perigram:staging --build-arg PORT=3001 .
      - name: redeploy container
        env:
          NUXT_MONGODB_URI: ${{ secrets.NUXT_MONGODB_URI }}
          LIVEKIT_PUBLIC_URL: ${{ secrets.LIVEKIT_PUBLIC_URL }}
          LIVEKIT_INTERNAL_URL: ${{ secrets.LIVEKIT_INTERNAL_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          docker rm -f perigram-staging || true
          docker run -d --name perigram-staging --restart unless-stopped \
            --network=host \
            -e NUXT_MONGODB_URI \
            -e LIVEKIT_PUBLIC_URL \
            -e LIVEKIT_INTERNAL_URL \
            -e LIVEKIT_API_KEY \
            -e LIVEKIT_API_SECRET \
            perigram:staging
