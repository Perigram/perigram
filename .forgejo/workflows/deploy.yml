name: deploy-staging
on:
  push:
    branches: [ staging ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: deploy
    container:
      image: docker:cli
      options: --add-host forgejo.sodalab.pro:192.168.0.15
    steps:
      - name: tools
        run: apk add --no-cache bash git
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_HTTP_PROXY: ${{ secrets.BUILD_HTTP_PROXY }}
          BUILD_HTTPS_PROXY: ${{ secrets.BUILD_HTTPS_PROXY }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${TOKEN}@forgejo.sodalab.pro/perigram/perigram.git" .
          git -c http.proxy="${BUILD_HTTP_PROXY:-}" \
              -c https.proxy="${BUILD_HTTPS_PROXY:-}" \
              submodule update --init --depth 1 workers/nesting/jagua-rs
      - name: deploy
        env:
          BUILD_HTTP_PROXY: ${{ secrets.BUILD_HTTP_PROXY }}
          BUILD_HTTPS_PROXY: ${{ secrets.BUILD_HTTPS_PROXY }}
          BUILD_NO_PROXY: ${{ secrets.BUILD_NO_PROXY }}
          NUXT_MONGODB_URI: ${{ secrets.NUXT_MONGODB_URI }}
          BASE_URL: ${{ secrets.BASE_URL }}
          LIVEKIT_PUBLIC_URL: ${{ secrets.LIVEKIT_PUBLIC_URL }}
          LIVEKIT_INTERNAL_URL: ${{ secrets.LIVEKIT_INTERNAL_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          TRANSCRIPTION_PROVIDER: ${{ secrets.TRANSCRIPTION_PROVIDER }}
          TRANSCRIPTION_LOCAL_BASE_URL: ${{ secrets.TRANSCRIPTION_LOCAL_BASE_URL }}
          MEETINGS_LLM_BASE_URL: ${{ secrets.MEETINGS_LLM_BASE_URL }}
          MEETINGS_LLM_MODEL: ${{ secrets.MEETINGS_LLM_MODEL }}
          LIVEKIT_RECORDINGS_S3_ENDPOINT: ${{ secrets.LIVEKIT_RECORDINGS_S3_ENDPOINT }}
          LIVEKIT_RECORDINGS_S3_BUCKET: ${{ secrets.LIVEKIT_RECORDINGS_S3_BUCKET }}
          LIVEKIT_RECORDINGS_S3_UPLOAD_ENDPOINT: ${{ secrets.LIVEKIT_RECORDINGS_S3_UPLOAD_ENDPOINT }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          NUXT_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          NUXT_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: ./scripts/deploy.sh
