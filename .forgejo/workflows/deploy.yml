name: deploy-staging
on:
  push:
    branches: [ staging ]
jobs:
  deploy:
    runs-on: deploy
    container:
      image: docker:cli
      options: --add-host forgejo.sodalab.pro:192.168.0.15
    steps:
      - name: tools
        run: apk add --no-cache git
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${TOKEN}@forgejo.sodalab.pro/perigram/perigram.git" .
      - name: build image
        run: docker build --network=host -t perigram:staging --build-arg PORT=3001 .
      - name: redeploy container
        env:
          NUXT_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          NUXT_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          docker rm -f perigram-staging || true
          docker run -d --name perigram-staging --restart unless-stopped \
            --network=host \
            -e NUXT_MONGODB_URI=mongodb://192.168.0.248:27017/cutkit \
            -e BASE_URL=https://perigram.sodalab.pro \
            -e NUXT_PUBLIC_BASE_URL=https://perigram.sodalab.pro \
            -e LIVEKIT_PUBLIC_URL=ws://10.77.219.223:7880 \
            -e LIVEKIT_INTERNAL_URL=ws://10.77.219.223:7880 \
            -e LIVEKIT_API_KEY=3a75db6bdbfc3048d69dee4b \
            -e LIVEKIT_API_SECRET=WgT04XbkXYjW98T03yh9YNydB3I2p0ho8to67dik0k \
            -e TRANSCRIPTION_PROVIDER=local \
            -e TRANSCRIPTION_LOCAL_BASE_URL=http://10.77.167.148:31135/v1 \
            -e MEETINGS_LLM_BASE_URL=http://10.77.167.148:31136/v1 \
            -e MEETINGS_LLM_MODEL=qwen3:4b \
            -e LIVEKIT_RECORDINGS_S3_ENDPOINT=http://192.168.0.15:8333 \
            -e LIVEKIT_RECORDINGS_S3_BUCKET=livekit-egress \
            -e NUXT_VAPID_PUBLIC_KEY \
            -e NUXT_VAPID_PRIVATE_KEY \
            perigram:staging
