<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perigram mark — Rive embed demo</title>
<style>
  body { margin: 0; background: #0d0d0d; color: #a0a0a0;
         font: 12px system-ui, sans-serif; display: flex; gap: 48px;
         align-items: flex-start; padding: 48px; }
  section { display: flex; flex-direction: column; gap: 12px; }
  canvas { background: #161616; border-radius: 8px; }
  aside { border-right: 1px solid #242424; padding: 16px; min-height: 320px;
          display: flex; align-items: flex-start; gap: 12px; }
</style>
</head>
<body>
  <section>
    <canvas id="loader" width="96" height="96"></canvas>
    <span>animations: ["load"]</span>
  </section>
  <aside>
    <canvas id="sidebar" width="72" height="72"></canvas>
    <nav>
      <div>Home</div><div>Queues</div><div>Libraries</div>
      <div>Cassettes</div><div>Sheets</div>
    </nav>
    <span style="align-self:flex-end">stateMachines: ["Lifecycle"]</span>
  </aside>
  <script src="https://unpkg.com/@rive-app/canvas@2"></script>
  <script>
    const RIVE_FILE = '../../../public/rive/perigram-mark.riv';

    const loader = new rive.Rive({
      src: RIVE_FILE,
      canvas: document.getElementById('loader'),
      autoplay: true,
      animations: ['load'],
      onLoad: () => loader.resizeDrawingSurfaceToCanvas()
    });

    const sidebar = new rive.Rive({
      src: RIVE_FILE,
      canvas: document.getElementById('sidebar'),
      autoplay: true,
      stateMachines: ['Lifecycle'],
      onLoad: () => sidebar.resizeDrawingSurfaceToCanvas()
    });
  </script>
</body>
</html>
